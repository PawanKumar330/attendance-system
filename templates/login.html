<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Attendance System</title>
  <meta name="description" content="Admin login for the Student Attendance System." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 12px;
    }
    .brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .brand p {
      font-size: 0.82rem;
      color: #64748b;
    }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: 0.82rem;
      color: #dc2626;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%,100%{ transform:translateX(0) }
      25%    { transform:translateX(-5px) }
      75%    { transform:translateX(5px) }
    }

    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .input-wrap { position: relative; }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.92rem;
      color: #1e293b;
      background: #f8fafc;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus {
      border-color: #2563eb;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.95rem;
      opacity: 0.45;
      pointer-events: none;
    }
    .toggle-pw {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      opacity: 0.45;
      padding: 4px;
      transition: opacity .15s;
    }
    .toggle-pw:hover { opacity: 0.75; }

    .btn-submit {
      width: 100%;
      padding: 11px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover { background: #1d4ed8; }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .65s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="brand-icon">📋</span>
      <h1>Attendance System</h1>
      <p>Sign in to your admin panel</p>
    </div>

    {% if error %}
    <div class="error-box" role="alert">
      <span>⚠️</span> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login" id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input type="text" id="username" name="username"
                 placeholder="Enter username" autocomplete="username"
                 required autofocus />
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" name="password"
                 placeholder="Enter password" autocomplete="current-password"
                 required />
          <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show/hide password">👁</button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="login-btn">
        <div class="spinner" id="spinner"></div>
        <span id="btn-text">Sign In →</span>
      </button>
    </form>
  </div>

  <script>
    document.getElementById('toggle-pw').addEventListener('click', function() {
      const pw = document.getElementById('password');
      const isHidden = pw.type === 'password';
      pw.type = isHidden ? 'text' : 'password';
      this.textContent = isHidden ? '🙈' : '👁';
    });
    document.getElementById('login-form').addEventListener('submit', function() {
      document.getElementById('login-btn').disabled = true;
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('btn-text').textContent = 'Signing in…';
    });
  </script>
</body>
</html>
