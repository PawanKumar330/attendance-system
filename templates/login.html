<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Attendance System</title>
  <meta name="description" content="Secure admin login for the Student Attendance System." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & tokens ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg:            #0a0f1e;
      --color-bg-card:       #111827;
      --color-bg-surface:    #1a2235;
      --color-border:        rgba(99,132,255,0.15);
      --color-border-strong: rgba(99,132,255,0.3);
      --color-primary:       #6384ff;
      --color-primary-light: #8fa4ff;
      --color-primary-glow:  rgba(99,132,255,0.25);
      --color-accent:        #a78bfa;
      --color-success:       #34d399;
      --color-error:         #f87171;
      --color-error-bg:      rgba(248,113,113,0.08);
      --color-error-border:  rgba(248,113,113,0.3);
      --color-text-primary:  #f1f5f9;
      --color-text-secondary:#94a3b8;
      --color-text-muted:    #64748b;
      --font-sans:           'Inter', system-ui, sans-serif;
      --radius-sm:           6px;
      --radius-md:           10px;
      --radius-lg:           16px;
      --radius-xl:           24px;
      --radius-full:         9999px;
      --transition-fast:     0.15s ease;
      --transition-normal:   0.25s ease;
      --shadow-glow:         0 0 60px rgba(99,132,255,0.12), 0 20px 60px rgba(0,0,0,0.5);
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Animated background ─────────────────────────────────────── */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: orb-drift 18s ease-in-out infinite alternate;
    }
    .bg-orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #6384ff, transparent 70%);
      top: -100px; left: -100px;
      animation-duration: 20s;
    }
    .bg-orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #a78bfa, transparent 70%);
      bottom: -80px; right: -80px;
      animation-duration: 16s;
      animation-direction: alternate-reverse;
    }
    .bg-orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #34d399, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-duration: 24s;
      opacity: 0.08;
    }
    @keyframes orb-drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.05); }
    }

    /* ── Page layout ─────────────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── Login card ──────────────────────────────────────────────── */
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: 44px 40px 40px;
      box-shadow: var(--shadow-glow);
      animation: card-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Brand / header ──────────────────────────────────────────── */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
    }
    .brand-icon {
      width: 60px; height: 60px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 6px 28px var(--color-primary-glow);
    }
    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--color-text-primary) 0%, var(--color-primary-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
    }
    .brand-subtitle {
      font-size: 0.82rem;
      color: var(--color-text-muted);
      text-align: center;
    }

    /* ── Form ────────────────────────────────────────────────────── */
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      pointer-events: none;
      opacity: 0.5;
    }
    .form-input {
      width: 100%;
      background: var(--color-bg-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 12px 14px 12px 42px;
      font-family: var(--font-sans);
      font-size: 0.92rem;
      color: var(--color-text-primary);
      outline: none;
      transition:
        border-color var(--transition-fast),
        box-shadow var(--transition-fast),
        background var(--transition-fast);
      -webkit-autofill: none;
    }
    .form-input::placeholder { color: var(--color-text-muted); }
    .form-input:focus {
      border-color: var(--color-primary);
      background: var(--color-bg-card);
      box-shadow: 0 0 0 3px var(--color-primary-glow);
    }

    /* show/hide password toggle */
    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      line-height: 1;
      transition: color var(--transition-fast);
    }
    .toggle-pw:hover { color: var(--color-text-primary); }

    /* ── Error banner ────────────────────────────────────────────── */
    .error-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--color-error-bg);
      border: 1px solid var(--color-error-border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 22px;
      font-size: 0.82rem;
      color: var(--color-error);
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%,100%{ transform: translateX(0); }
      20%    { transform: translateX(-6px); }
      40%    { transform: translateX(6px); }
      60%    { transform: translateX(-4px); }
      80%    { transform: translateX(4px); }
    }

    /* ── Submit button ───────────────────────────────────────────── */
    .btn-login {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--color-primary), #7c6de8);
      color: #fff;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--color-primary-glow);
      transition:
        background var(--transition-fast),
        box-shadow var(--transition-fast),
        transform var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, var(--color-primary-light), #9c8df5);
      box-shadow: 0 6px 28px rgba(99,132,255,0.4);
      transform: translateY(-1px);
    }
    .btn-login:active { transform: translateY(0); }

    /* spinner inside button */
    .btn-spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ──────────────────────────────────────────────────── */
    .login-footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.72rem;
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>

  <div class="bg-orbs" aria-hidden="true">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
  </div>

  <main class="page">
    <div class="login-card" role="main">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">📋</div>
        <h1 class="brand-title">Attendance System</h1>
        <p class="brand-subtitle">Sign in to your admin panel</p>
      </div>

      <!-- Error banner (shown on failed login) -->
      {% if error %}
      <div class="error-banner" role="alert">
        <span aria-hidden="true">⚠️</span>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <!-- Login form -->
      <form id="login-form" method="POST" action="/login" novalidate>

        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">👤</span>
            <input
              type="text"
              id="username"
              name="username"
              class="form-input"
              placeholder="Enter username"
              autocomplete="username"
              required
              autofocus
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="toggle-pw"
              id="toggle-pw-btn"
              aria-label="Toggle password visibility"
            >👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="login-btn">
          <div class="btn-spinner" id="btn-spinner" aria-hidden="true"></div>
          <span id="btn-text">🚀 Sign In</span>
        </button>

      </form>
    </div>

    <footer class="login-footer">
      Student Attendance System &bull; Admin Portal
    </footer>
  </main>

  <script>
    // Toggle password visibility
    const pwInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-pw-btn');
    toggleBtn.addEventListener('click', () => {
      const isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      toggleBtn.textContent = isHidden ? '🙈' : '👁️';
    });

    // Show spinner on submit
    document.getElementById('login-form').addEventListener('submit', () => {
      const btn     = document.getElementById('login-btn');
      const spinner = document.getElementById('btn-spinner');
      const text    = document.getElementById('btn-text');
      btn.disabled  = true;
      spinner.style.display = 'block';
      text.textContent = 'Signing in…';
    });
  </script>

</body>
</html>
